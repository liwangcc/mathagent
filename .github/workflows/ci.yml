name: tests

on:
  push:
    branches: [main, "ci/**"]
  pull_request:

# 最小权限：job（含 fork 来的 PR）只读源码，不需要写 token。
permissions:
  contents: read

# 同一分支/PR 连续推送时取消上一次未跑完的运行，避免排队与重复占用 runner。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-smoke:
    name: 后端冒烟测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 语法检查（全量 Python 文件可编译）
        run: python -m compileall -q app.py config.py routers services database.py

      - name: 鉴权与安全回归
        # 只跑不依赖外部模型/网络的用例：认证、短信限流、连接测试、安全加固，
        # 以及设置页写 .env 的注入/并发回归、CSP 白名单、Host 校验。
        # 完整套件需要模型与 Redis，留给本地 venv 执行。
        run: |
          pytest -q \
            tests/test_auth.py \
            tests/test_security_hardening.py \
            tests/test_security_report_fixes.py \
            tests/test_sms_send_guard.py \
            tests/test_settings_test_connection.py \
            tests/test_settings_env_injection.py \
            tests/test_env_sync.py \
            tests/test_csp_policy.py \
            tests/test_allowed_hosts.py

      - name: 依赖一致性
        run: pip check

  backend-golden:
    name: 后端特征测试（golden）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 特征测试
        # golden 钉的是解码后的像素（尺寸 + RGB 字节），锁渲染结果而不是 PNG
        # 编码器；这三个文件只调本地函数和内存内的 FastAPI 测试客户端，不需要
        # 模型、Redis 或网络，所以可以进 CI。
        run: |
          pytest -q \
            tests/test_full_column_evidence_characterization.py \
            tests/test_recognition_stream_characterization.py \
            tests/test_orientation_confirm_characterization.py

  frontend-test:
    name: 前端测试与构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 跟随仓库根的 .nvmrc，避免 CI 与本机 Node 版本各说各话。
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        # 用锁文件安装，保证 CI 装的依赖和 package-lock.json 完全一致。
        run: npm ci

      - name: 单元测试
        run: npm run test

      - name: 生产构建
        run: npm run build