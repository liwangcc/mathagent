[pytest]
# The backend regression suite lives in tests/.  A bare ``pytest -q`` from the
# repository root must not wander into gitignored snapshot/probe directories
# (outputs/, output/, live_*/, backups/ ...): they hold stale copies of tests/
# whose duplicate module names break collection, and scripts/ holds live
# provider probes that must never run as tests.
testpaths = tests
norecursedirs =
    .* *.egg _darcs build CVS dist node_modules venv {arch}
    venv_local backups output outputs uploads data static releases logs
    live_* qwen37_acceptance_* 20260902_* frame-review-v9 scripts
    学生档案 批阅失败
