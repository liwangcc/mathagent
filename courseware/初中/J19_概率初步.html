</style><style id="lesson-flow-style">/* MathAgent lesson flow v1 — presentation only (see lesson-flow.js). */
:root{--lf-motivate:#843f05;--lf-motivate-bg:#fff5e8;--lf-explore:#174f8f;--lf-explore-bg:#edf4fc;--lf-formalize:#0b5a53;--lf-formalize-bg:#e9f5f2;--lf-practice:#4f2398;--lf-practice-bg:#f3effb;--lf-ink:#10292a;--lf-soft:#33494a;--lf-line:#d3dfda}
body{--lf-c:var(--lf-motivate);--lf-bg:var(--lf-motivate-bg)}
body[data-lf-stage=explore]{--lf-c:var(--lf-explore);--lf-bg:var(--lf-explore-bg)}
body[data-lf-stage=formalize]{--lf-c:var(--lf-formalize);--lf-bg:var(--lf-formalize-bg)}
body[data-lf-stage=practice]{--lf-c:var(--lf-practice);--lf-bg:var(--lf-practice-bg)}
/* Projector type scale: 1280 px wide ≈ the minimums; grows to a 1920 px whiteboard.
   「大字」 (the chapter's own projector toggle) adds one more step. */
body.lf-on{--lf-t-read:clamp(19px,1.1vw + 5px,25px);--lf-t-key:clamp(21px,1.2vw + 6px,28px);--lf-t-eq:clamp(30px,1.7vw + 8px,40px);--lf-t-title:clamp(26px,1.4vw + 8px,34px);--lf-t-sub:clamp(17px,.8vw + 7px,21px);--lf-t-ui:clamp(15px,.6vw + 7px,18px)}
body.lf-on.projector,body.lf-on.large,body.lf-on.presentation{--lf-t-read:clamp(22px,1.3vw + 6px,29px);--lf-t-key:clamp(24px,1.4vw + 7px,32px);--lf-t-eq:clamp(34px,2vw + 9px,46px);--lf-t-sub:clamp(19px,.9vw + 8px,23px)}

/* Rail: four steps · prev/next · overview · help */
.lf-rail{position:relative;display:flex;align-items:center;gap:8px;flex-wrap:nowrap;justify-content:flex-end;margin-left:auto;flex:none}
.lf-steps{display:flex;gap:4px;list-style:none;margin:0;padding:3px;border:1px solid var(--lf-line);border-radius:999px;background:#fff}
.lf-steps li{margin:0}
.lf-step{display:flex;align-items:center;gap:6px;border:0!important;background:transparent!important;box-shadow:none!important;border-radius:999px!important;padding:5px 12px 5px 6px!important;min-height:36px;font-size:var(--lf-t-ui,16px);font-weight:650;color:var(--lf-soft)!important;white-space:nowrap}
.lf-step b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;font-size:13px;background:#e8eeeb;color:var(--lf-soft)}
.lf-step[data-lf-stage=motivate]{--c:var(--lf-motivate)}.lf-step[data-lf-stage=explore]{--c:var(--lf-explore)}.lf-step[data-lf-stage=formalize]{--c:var(--lf-formalize)}.lf-step[data-lf-stage=practice]{--c:var(--lf-practice)}
.lf-step:hover{background:#f1f5f3!important}
.lf-step.active{background:var(--c)!important;color:#fff!important}
.lf-step.active b{background:#fff;color:var(--c)}
.lf-move{display:flex;gap:6px}
.lf-move button,.lf-overview,.lf-help{min-height:40px;font-size:var(--lf-t-ui,15px);font-weight:650;border-radius:10px;padding:7px 13px;white-space:nowrap}
.lf-prev{width:6.9em}
.lf-next{background:var(--lf-c)!important;border-color:var(--lf-c)!important;color:#fff!important;width:14.4em;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.lf-next span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.lf-next:disabled{background:#e9eeeb!important;border-color:#d7e0db!important;color:#33494a!important;opacity:1}
.lf-help{width:40px;padding:0!important;font-weight:800}
.lf-help-panel{position:absolute;right:0;top:calc(100% + 8px);z-index:40;width:min(470px,92vw);background:#fff;color:var(--lf-ink);border:1px solid var(--lf-line);border-radius:14px;box-shadow:0 18px 44px #10292a33;padding:16px 18px;font-size:16px;line-height:1.6;text-align:left}
.lf-help-panel strong{display:block;font-size:17px;margin-bottom:6px;outline:none}
.lf-help-panel ul{margin:0;padding-left:20px}.lf-help-panel li{margin:4px 0}
.lf-help-panel kbd{font:600 13px ui-monospace,monospace;border:1px solid #c5d2cc;border-bottom-width:2px;border-radius:5px;padding:0 5px;background:#f6f8f7}

/* Stage card head (inside the existing side panel) */
.lf-card-head{display:none}
body.lf-on .lf-card-head{display:flex;gap:12px;align-items:center;padding:11px 16px;border-radius:14px;background:var(--lf-bg);border:1px solid #d9e2de;border:1px solid color-mix(in srgb,var(--lf-c) 28%,#fff);border-left:6px solid var(--lf-c)}
.lf-num{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--lf-c);color:#fff;font-size:19px;font-weight:800}
.lf-cue-line{margin:0!important;font-size:var(--lf-t-read)!important;line-height:1.45!important;color:var(--lf-ink)!important}
.lf-title{font-size:1.06em;color:var(--lf-c);margin-right:.55em;letter-spacing:.04em}
.lf-hint{display:none}
body.lf-on .lf-hint{display:block;font-size:14px;color:var(--lf-soft);margin-left:auto;margin-right:8px;text-align:right;line-height:1.3}

/* Controls inside the stage card never drop below 16 px on a projector. */
body.lf-on .lf-card button:not(.token){font-size:max(16px,var(--lf-t-ui));min-height:38px}
/* Data tables shown in a stage card are key content: reading size. */
body.lf-on .lf-card table th,body.lf-on .lf-card table td{font-size:var(--lf-t-read)}
/* Formula annotations (small/sub/sup labels) stay readable: 16 px, dark ink. */
body.lf-on .lf-card small{font-size:16px;font-weight:600;color:var(--lf-soft)}

/* Calm, legible transitions; reduced motion removes them entirely. */
@keyframes lf-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
body.lf-on .lf-card.lf-enter>*{animation:lf-in .24s ease-out both}
@media (prefers-reduced-motion:reduce){body.lf-on .lf-card.lf-enter>*{animation:none!important}}
body.low-motion .lf-card.lf-enter>*,body.reduced .lf-card.lf-enter>*,body.lf-reduce .lf-card.lf-enter>*{animation:none!important}

/* Folding: hidden blocks leave the layout, except keep-layout ones (parameter
   bars) which collapse to zero height and are inert, so in-figure editors that
   list "visible" source controls keep working in every stage. */
body.lf-on .lf-fold:not(.lf-keep){display:none!important}

lesson(1,{mode:'die',mask:[false,true,false,true,false,true],target:7,focus:0},{purpose:'点击骰面真实改变事件集合；两骰的11种和不能因为类别数为11就各分1/11。',def:'随机事件可能发生也可能不发生；必然事件概率1，不可能事件概率0。有限个等可能基本结果下，概率=满足事件的基本结果数/基本结果总数。类别未必等可能，不能盲目数类别。',map:'单骰六面明确假定公平，点击骰面开关事件；双色高亮表示事件成员。两骰和模式的柱高是产生该和的有序组合个数，不是捏造的均分概率。',gestureHint:()=> '点击骰面开关事件 · 点击和的柱选择事件 · 数值和概率会同时改变',controls:[Sel('mode','样本空间',[['die','一枚公平骰子的六个面'],['sums','两骰的和：类别不等可能']]),N('target','两骰研究的和',2,12,1)],derive(s){const counts=Array.from({length:11},(_,i)=>K.dice(i+2).win),win=s.mode==='die'?s.mask.filter(Boolean).length:K.dice(s.target).win,total=s.mode==='die'?6:36;return {counts,win,total,p:win/total,fraction:K.fraction(win,total).text,valid:true};},formula:(s,d)=>`P(A)=${d.win}/${d.total}=${d.fraction}<span class="second">${s.mode==='die'?'基本结果是6个等可能骰面':'基本结果是36个等可能有序对，不是11个和'}</span>`,readings:(s,d)=>rd(['事件所含基本结果',d.win],['等可能基本结果总数',d.total],['概率',d.fraction],['事件类型',d.win===0?'不可能事件':d.win===d.total?'必然事件':'随机事件']),feedback:(s,d)=>s.mode==='die'?`选中的面为${s.mask.map((x,i)=>x?i+1:null).filter(Boolean).join('、')||'空集'}，概率${d.fraction}。点击实际改变集合，不只是高亮装饰。`:`和${s.target}由${d.win}个有序对产生，概率${d.fraction}。和2只有(1,1)，和7有6个组合，因此11个和不是等可能。`,draw(P,s,d,v){if(s.mode==='die'){P.begin(null);const cols=P.w<450?3:6,w=(P.w-35)/cols,h=100,rows=2,y0=65;s.mask.forEach((on,i)=>{const x=18+(i%cols)*w,y=y0+Math.floor(i/cols)*h,bw=Math.min(w-10,78);P.raw(`<g tabindex="0" role="button" data-drag="face:${i}" aria-label="骰面${i+1}，点击${on?'移出':'加入'}事件"><rect x="${x}" y="${y}" width="${bw}" height="72" rx="10" fill="${on?'#d2eade':'#f2f4f4'}" stroke="${on?C.teal:C.muted}" stroke-width="3"/>${txt(x+bw/2,y+47,i+1,{anchor:'middle',size:34,color:on?C.teal:C.muted})}${txt(x+bw/2,y+94,on?'事件内':'事件外',{anchor:'middle',size:16,color:on?C.teal:C.muted})}</g>`);});flag(P,'公平骰子：各面概率1/6；当前事件概率 '+d.fraction);return;}P.begin(zoomBounds({xmin:1,xmax:13,ymin:0,ymax:7.5},v),{xlabel:'两骰的和',ylabel:'有序组合数',xunit:'无量纲',yunit:'个'});d.counts.forEach((c,i)=>{const x=i+2;poly(P,[[x-.3 lesson(2,{mode:'dice',target:7,selected:5,red:2,blue:1,replace:false},{purpose:'列表每个格子对应一个有序结果；不放回树第二层的分母和颜色数必须真实更新。',def:'列表法和树状图法用于不重不漏地枚举结果。沿树枝计算联合概率时，第二步使用对应条件下的概率；不放回抽取会改变剩余总数与颜色构成，不能照搬放回的分母。',map:'列表行是第一骰、列是第二骰；(1,6)与(6,1)是不同有序结果。树上每条边标当步的颜色数量/当前总数，每个叶子标完整路径概率。',gestureHint:()=> '点击格子核验事件成员 · 抽球模式可真实增减红蓝球 · 空白拖动只移动图示',controls:s=>[Sel('mode','方法',[['dice','两骰6×6有序列表'],['balls','两次抽球树状图']]),...(s.mode==='dice'?[N('target','目标和',2,12,1)]:[N('red','红球数',0,8,1,'个'),N('blue','蓝球数',0,8,1,'个'),Check('replace','第一次后放回')])],derive(s){const dice=K.dice(s.target),leaves=K.ballTree(s.red,s.blue,s.replace),sum=leaves.reduce((a,b)=>a+b.p,0),pair=dice.cells[Math.min(35,s.selected)];return {...dice,leaves,sum,pair,valid:s.mode==='dice'||leaves.length>0};},formula:(s,d)=>s.mode==='dice'?`P(和=${s.target})=${d.win}/36=${d.fraction}`:`第一次分母N=${s.red+s.blue}<span class="second">第二次分母=${s.replace?'N':'N−1'}=${s.red+s.blue-(s.replace?0:1)}</span><span class="second">有效树叶概率和=${ap(d.sum)}</span>`,readings:(s,d)=>s.mode==='dice'?rd(['满足格数',d.win],['总格数',36],['概率',d.fraction],['已选结果',`(${d.pair.a},${d.pair.b})：${d.pair.win?'满足':'不满足'}目标和`]):rd(['初始红 / 蓝',s.red+' / '+s.blue+' 个'],['有效颜色路径数',d.leaves.length],['所有路径概率和',d.valid?ap(d.sum):'无法完成两次抽取'],['RR路径概率',d.leaves.find(x=>x.first==='红'&&x.second==='红')?ap(d.leaves.find(x=>x.first==='红'&&x.second==='红').p):'0']),feedback:(s,d)=>s.mode==='dice'?`选中(${d.pair.a},${d.pair.b})，和${d.pair.a+d.pair.b}，${d.pair.win?'满足':'不满足'}和为${s.target}。每格概率都是1/36。`:!d.valid?'球数不足以完成当前抽样方式，树没有完整叶子，不能强写总概率为1。':s.replace?'放回后恢复初始构成，所以第二次每种颜色数与总数都和第一次相同。':'不放回：若第一次抽红，第二次红球少1、总数少1；若第一次抽蓝，蓝球少1。树枝按各自条件更新。',draw(P,s,d,v){if(s.mode==='dice'){diceGrid(P,d,s.selected);return;}P.begin(null);flag(P,`红${s.red}、蓝${s.blue}；${s.replace?'放回':'不放回'}抽两次`,24);for(let i=0;i<s.red+s.blue;i++)P.raw(`<circle cx="${22+i*17}" cy="50" r="6" fill="${i<s.red?C.red:C.blue}"/>`);if(!d.valid){flag(P,'当前不能完成两次抽取',150,C.red);return;}const root=[30,P.h/2+10],midX=P.w*.38,endX=P.w-55;P.raw(txt(root[0],root[1]-9,'开始',{size:16}));for(const [color,count,yy] of [['红',s.red,P.h*.3+35],['蓝',s.blue,P.h*.75]]){if(!count)continue;const first=[midX,yy],col=color==='红'?C.red:C.blue;P.raw(seg(...root,...first,{color:col,width:2})+txt((root[0]+first[0])/2,(root[1]+first[1])/2-7,color+' '+count+'/'+(s.red+s.blue),{anchor:'middle',size:16,color:col})+txt(first[0],first[1]-8,color,{anchor:'middle',size:18,color:col}));const leaves=d.leaves.filter(l=>l.first===color);leaves.forEach((l,i)=>{const y=first[1]+(i-(leaves.length-1)/2)*65;P.raw(seg(first[0]+5,first[1],endX,y,{color:l.second==='红'?C.red:C.blue,width:2})+txt((first[0]+endX)/2,(first[1]+y)/2-9,l.second+' '+l.b+'/'+l.den,{anchor:'middle',size:16,color:l.second==='红'?C.red:C.blue})+txt(endX,y+6,K.fraction(l.a*l.b,l.N*l.den).text,{anchor:'middle',size:18,color:C.teal}));});}},tools:s=>s.mode==='balls'?butt('red+','增加红球')+butt('red-','减少红球')+butt('blue+','增加蓝球')+butt('blue-','减少蓝球'):'',tool(s,v,t){const k=t.startsWith('red')?'red':'blue';s[k]=M.clamp(s[k]+(t.endsWith('+')?1:-1),0,8);},click(s,d){if(d.drag?.startsWith('pair:'))s.selected=+d.drag.split(':')[1];},select(s,n){if(n.startsWith('pair:'))s.selected=+n.split(':')[1];},key(s,n,dx,dy){s.selected=M.clamp(s.selected+Math.sign(dx||dy),0,35);},counter:{mode:'balls',red:2,blue:1,replace:false},presets:[{label:'和7：六格',values:{mode:'dice',target:7}},{label:'2红1蓝，不放回',values:{mode:'balls',red:2,blue:1,replace:false}},{label:'相同球数，改放回',values:{mode:'balls',red:2,blue:1,replace:true}}],animation:{label:s=>s.mode==='dice'?'逐个选择36个有序结果并检查是否满足事件':'增加初始红球，重新计算每条分支的条件概率',apply(s,t){if(s.mode==='dice')s.selected=Math.round(35*t);else s.red=1+Math.round(5*t);}},table:(s,d)=>s.mode==='dice'?tableHTML(['满足目标的有序对'],d.cells.filter(x=>x.win).map(x=>['('+x.a+','+x.b+')'])):tableHTML(['路径','第一次','第二次（条件）','联合概率'],d.leaves.map(l=>[l.first+'→'+l.second,l.a+'/'+l.N,l.b+'/'+l.den,K.fraction(l.a*l.b,l.N*l.den).text])),reason:'<p>2红1蓝不放回抽两次：RR=2/3×1/2=1/3，RB=2/3×1/2=1/3，BR=1/3×2/2=1/3，BB不可能。三条有效颜色路径概率和1。</p><p>放回时RR=2/3×2/3=4/9，RB=2/9，BR=2/9，BB=1/9。颜色路径数即使为4也并非每条1/4；树枝必须带真实条件概率。</p>'}),
lesson(3,{N:200,shown:200,seed:2026,target:7,batch:100},{purpose:'实际伪随机试验记录构成频率曲线；倒放是回看已生成前缀，不把曲线强行推向理论线。',def:'事件频率=已发生次数/已试验次数。概率属于理论模型，频率属于具体记录。大量重复试验可观察频率稳定性，但单次增加试验并不保证更靠近概率，波动可能扩大。',map:'横轴是已回看的试验次数，纵轴是频率0至1。橙色水平线标“理论概率”，绿色折线严格由固定种子产生的实际骰面序列累计，未做平滑或向理论值插值。',controls:[N('N','生成的总试验数',0,2000,1,'次'),N('shown','回看前多少次',0,2000,1,'次'),N('seed','可复现种子',1,999999,1),N('target','事件：和=',2,12,1),N('batch','每批追加次数',1,500,1,'次')],derive(s){const all=K.trials(s.N,s.seed,s.target),n=Math.min(s.N,s.shown),res=all.results.slice(0,n),last=res[n-1],prev=res[n-2],f1=last?.f??null,p=all.p;return {all,res,n,last,p,f:f1,wins:last?.wins||0,valid:n>0,change:prev?Math.abs(last.f-p)-Math.abs(prev.f-p):null};},afterChange(s,k){if(k==='N'||k==='seed')s.shown=s.N;},formula:(s,d)=>`理论P(和=${s.target})=${K.dice(s.target).fraction}<span class="second">${d.valid?`当前频率=${d.wins}/${d.n}${'≈'+f(d.f,4)}`:'尚未观察任何试验：频率无定义'}</span>`,readings:(s,d)=>rd(['已生成总数',s.N+' 次'],['当前回看次数',d.n+' 次'],['发生次数',d.wins],['当前频率',d.valid?ap(d.f,4):'无定义'],['最后一步与理论的误差',d.change===null?'至少两次后再比较':d.change>1e-12?'增大：没有保证单调靠近':d.change<-1e-12?'减小':'不变']),feedback:(s,d)=>d.valid?`最后一次掷出(${d.last.a},${d.last.b})，${d.last.hit?'满足':'不满足'}事件。种子${s.seed}下的这些试验可重现；反向播放只回看记录，不撤销历史或重新随机。`:'没有已观察试验，频率不是0。可以“再投1次”或批量追加；理论概率仍由36格计数得到。',draw(P,s,d,v){const xmax=Math.max(20,s.N);P.begin(zoomBounds({xmin:0,xmax,ymin:-.03,ymax:1.08},v),{xlabel:'试验次数',ylabel:'频率',xunit:'次',yunit:'无量纲'});P.line(0,d.p,xmax,d.p,{color:C.amber,dash:'7 4',sem:'theory',width:2.5});P.addLabel('theory','理论 '+K.dice(s.target).fraction,P.x(xmax*.72),P.y(d.p),{color:C.amber,priority:4});if(d.res.length){P.raw(`<polyline points="${d.res.map(q=>P.x(q.n)+','+P.y(q.f)).join(' ')}" fill="none" stroke="${C.teal}" stroke-width="2.2"/>`);P.point('observed',d.n,d.f,'第'+d.n+'次：'+ap(d.f,4),{handle:'shown',color:C.teal});}else flag(P,'无试验记录，频率暂未定义');},tools:()=>butt('one','再投1次')+butt('batch','追加一批')+butt('reset','清空试验')+butt('full','回到完整记录')+butt('seed','新种子重做'),tool(s,v,t){if(t==='reset'){s.N=0;s.shown=0;}else if(t==='full')s.shown=s.N;else if(t==='seed'){s.seed=s.seed%999999+1;s.shown=s.N;}else{s.N=Math.min(2000,s.N+(t==='one'?1:s.batch));s.shown=s.N;}},drag(s,n,p){if(n==='shown')s.shown=cl(p.x,0,s.N,1);},key(s,n,dx,dy){s.shown=cl(s.shown+Math.sign(dx||dy),0,s.N,1);},counter:{N:10,shown:10,seed:1,target:7},presets:[{label:'200次和7，固定种子2026',values:{N:200,shown:200,seed:2026,target:7}},{label:'稀有事件：和12',values:{N:200,shown:200,target:12}}],animation:{label:()=> '沿已生成记录回放累计频率；倒放只是回看前缀',apply(s,t){if(s.N===0)s.N=200;s.shown=Math.round(s.N*t);}},table:(s,d)=>tableHTML(['试验序号','骰面有序对','事件发生','累计频率'],d.res.slice(-80).map(q=>[q.n,'('+q.a+','+q.b+')',q.hit?'是':'否',ap(q.f,4)]))+'<p>此表显示最近至多80次；完整序列可由导出的种子、总次数和事件参数逐次重现。</p>',reason:'<p>频率变化是分子、分母共同改变的结果。一次未发生事件可能让频率远离较大的理论值；一次发生事件也可能使本已高于理论值的频率偏得更远。因此“总试验次数变多”不等于“每一步误差都减小”。</p><p>数据来自本机种子伪随机生成器，两个骰面分别取1至6。图线逐点连接这些实际记录，绝不使用趋近理论值的补间动画。教学概率模型假定两枚公平骰子相互独立。</p>'}),

</script><script>/* v4: manual parameter editing and graph operations share a single numerical contract.
 * Scene callbacks retain mathematical meaning; this is not a free-shape editor.
 * Original presets/counterexamples/continuous teaching animations remain separate paths.
 */
'use strict';
const InteractionRules=(()=>{
 const equal=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
 const descriptor=(scene,s,key)=>(scene.controls?.(s)||[]).find(c=>c.key===key);
 function number(c,raw){
  if(!c||c.type!=='number'||!Number.isFinite(raw))throw Error('不是允许的有限数值参数');
  const step=Number(c.step)||1,base=Number(c.min),max=Number(c.max);
  const last=Math.floor((max-base)/step+1e-8);
  const n=Math.max(0,Math.min(last,Math.round((raw-base)/step)));
  return M.clean(Number((base+n*step).toPrecision(13)));
 }
 function value(scene,s,key,raw){return number(descriptor(scene,s,key),raw);}
 function changed(before,after){return Object.keys(after).filter(k=>!equal(before[k],after[k]));}
 function normalize(scene,before,after){
  const changedKeys=changed(before,after),active=scene.controls?.(after)||[];
  for(const k of changedKeys){
   const c=active.find(c=>c.key===k);if(!c)continue;
   if(c.type==='number')after[k]=number(c,after[k]);
   else if(c.type==='select'&&!c.options.some(([x])=>x===after[k]))throw Error('该场景未允许此选项');
   else if(c.type==='checkbox'&&typeof after[k]!=='boolean')throw Error('开关必须为布尔值');
  }
  // Ordered endpoints are one original coupled control; empty inequalities in J07 are intentional.
  if(scene.id.slice(0,3)!=='J07'&&Number.isFinite(after.lo)&&Number.isFinite(after.hi)&&after.lo>after.hi){
   if(changedKeys.includes('lo')&&!changedKeys.includes('hi'))after.lo=after.hi;
   else if(changedKeys.includes('hi')&&!changedKeys.includes('lo'))after.hi=after.lo;
   else throw Error('左端点不能大于右端点');
  }
  for(const k of changedKeys)if(descriptor(scene,after,k))scene.afterChange?.(after,k);
  // A dependent control may be changed by afterChange; apply its declared contract too.
  for(const k of changed(before,after)){const c=descriptor(scene,after,k);if(c?.type==='number')after[k]=number(c,after[k]);}
  return changed(before,after);
 }
 function quickKeys(scene,s,name){
  let keys=[];
  if(descriptor(scene,s,name)?.type==='number')keys.push(name);
  for(const k of [name+'x',name+'y'])if(descriptor(scene,s,k)?.type==='number')keys.push(k);
  const map={
   'J08-S01':{inputBead:['x'],probe:['x']},
   'J08-S02':{probe:['x']},
   'J08-S03':{probe:['x'],intercept:['b'],slope:['k'],lineBody:['b']},
   'J08-S04':{probe:['x'],threshold:['c'],thresholdLine:['c'],lineBody:['b']},
   'J09-S01':{rect:['x'],rectWidth:['x']},
   'J09-S02':{probe:['x'],coefficient:['k']},
   'J09-S03':{probe:['x']},
   'J10-S01':{vertex:['p','q'],curve:['p','q']},
   'J10-S02':{vertex:['p','q'],curve:['p','q'],symmetry:['t']},
   'J10-S03':{vertex:['p','q'],curve:['p','q'],probe:['x'],domainLo:['lo'],domainHi:['hi']},
   'J10-S04':{vertex:['p','q'],curve:['p','q']},
   'J10-S05':{fence:['x'],probe:['x']},
   'J17-S01':{imageA:['dx','dy']},
   'J17-S02':{light:['lx','lz'],object:['ox','height']},
   'J17-S03':{dimL:['L'],dimW:['W'],dimH:['H']},
   'J17-S04':{fold:['fold']}
  };
  keys.push(...(map[scene.id]?.[name]||[]));
  return [...new Set(keys)].filter(k=>descriptor(scene,s,k)?.type==='number');
 }
 return {descriptor,number,value,changed,normalize,quickKeys};
})();

</script><script id="lesson-flow">/* MathAgent lesson flow v1 — presentation layer only.
   Re-sequences the chapter's EXISTING blocks into a teacher-paced rhythm:
   引入 → 探究 → 归纳 → 练习 (motivate → explore → formalize → practice).
   It never writes mathematical state and never calls scene/model functions
   except the runtime's own scene navigation. Every formula, definition and
   answer shown in a stage is the node the chapter already rendered; the only
   text added here is generic classroom guidance (stage names and prompts).
   Stages are views, not gates: any stage and the full workbench (总览) are
   one click or key away. Works identically for the WebGL and SVG paths.
   Only nodes the runtime reaches by global id are moved; anything it finds
   relative to a parent (e.g. a tool row's hint) is mirrored, never moved. */
(function () {
  'use strict';
  if (window.LessonFlow) return;
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const text = el => (el ? el.textContent.replace(/\s+/g, ' ').trim() : '');
  const STAGES = [
    { id: 'motivate', n: 1, name: '引入', cue: '先看图：说一说图中每种颜色、每个标注表示什么。' },
    { id: 'explore', n: 2, name: '探究', cue: '动手试：改变一个量，看图、式子和数值怎样一起变。' },
    { id: 'formalize', n: 3, name: '归纳', cue: '说规律：用定义把发现说完整，注意成立条件。' },
    { id: 'practice', n: 4, name: '练习', cue: '试一试：先独立作答，再检查或看答案。' },
  ];

  /* Each adapter only names existing DOM of one runtime family.
     blocks: key → { el, keep (fold in place of leaving layout), open (details) }
     stages: stage → ordered block keys shown in the stage card
     pins:   [element, destination] moved into always-visible chrome in lesson mode */
  const ADAPTERS = {
    primary: {
      detect: () => !!(window.CW && window.CW.app && $('#scene-nav') && $('.info-panel')),
      sceneCount: () => window.CW.app.scenes.length,
      sceneIndex: () => window.CW.app.current,
      sceneName: i => window.CW.app.scenes[i]?.title || '',
      goScene: i => window.CW.app.go(i),
      watch: () => [$('#scene-title')],
      live: () => $('#announcer'),
      heading: () => $('.scene-heading'),
      card: () => $('.info-panel'),
      figurePanel: () => $('.model-panel'),
      math: () => { try { return JSON.stringify(window.CW.snapshot().state); } catch (_) { return null; } },
      tools: () => [$('#fraction-tools'), $('#canvas-view-tools')].filter(Boolean),
      toolsAnchor: () => $('.model-top'),
      hint: () => $('#canvas-gesture-hint'),
      hintAnchor: () => $('.model-top'),
      // Figure keeps its aspect and is sized to the first screen under its real top edge.
      fit: { el: '#diagram', below: ['#timeline'], min: 300 },
      blocks: {
        look: { el: () => $$('.info-panel > .info-block')[1] },
        definition: { el: () => $$('.info-panel > .info-block')[0] },
        current: { el: () => $('.info-panel > .info-block.current') },
        controls: { el: () => $('#controls'), keep: true },
        note: { el: () => $('#figure-note') },
        exercise: { el: () => $('#exercise'), open: true },
      },
      stages: {
        motivate: ['look'],
        explore: ['controls', 'current', 'note'],
        formalize: ['definition', 'current'],
        practice: ['exercise'],
      },
    },
    junior: {
      detect: () => !!(window.MathAgent && $('#sceneNav [data-scene]') && $('aside.reading')),
      nav: () => $$('#sceneNav [data-scene]'),
      sceneCount() { return this.nav().length; },
      sceneIndex() { return Math.max(0, this.nav().findIndex(b => b.classList.contains('active'))); },
      sceneName(i) { return text(this.nav()[i]?.querySelector('.scene-name')) || text(this.nav()[i]); },
      goScene(i) { this.nav()[i]?.click(); },
      watch: () => [$('#sceneTitle')],
      live: () => $('#live'),
      heading: () => $('.scene-heading'),
      card: () => $('aside.reading'),
      figurePanel: () => $('.figure-card'),
      math: () => { try { return JSON.stringify(window.MathAgent.mathState); } catch (_) { return null; } },
      blocks: {
        look: { el: () => $('#mapping') },
        select: { el: () => $('#selectedNote') },
        demo: { el: () => $('section.timeline') },
        controls: { el: () => $('.controls-card'), keep: true },
        label: { el: () => $('aside.reading > .eyebrow') },
        definition: { el: () => $('#definition') },
        formula: { el: () => $('#formula') },
        readings: { el: () => $('#readings') },
        feedback: { el: () => $('#feedback') },
        boundary: { el: () => $('#counterexample') },
        snapshot: { el: () => $('#snapshot') },
        exercise: { el: () => $('#exerciseDetails'), open: true },
      },
      stages: {
        motivate: ['look', 'select', 'demo'],
        explore: ['controls', 'formula', 'readings', 'feedback', 'select', 'demo', 'snapshot'],
        formalize: ['label', 'definition', 'formula', 'readings', 'boundary'],
        practice: ['exercise'],
      },
      // 撤销 / 恢复本场景 stay one click away in every stage (they live below the fold otherwise).
      pins: () => [[$('#undo'), $('.top-tools')], [$('#resetScene'), $('.top-tools')]],
    },
    senior: {
      detect: () => !!(window.CourseApp && $('#tabs [data-scene]') && $('aside.lesson')),
      nav: () => $$('#tabs [data-scene]'),
      sceneCount() { return this.nav().length; },
      sceneIndex() {
        let id = null; try { id = window.CourseApp.getState().scene; } catch (_) {}
        const i = this.nav().findIndex(b => (id ? b.dataset.scene === id : b.classList.contains('active')));
        return Math.max(0, i);
      },
      sceneName(i) { const b = this.nav()[i]; if (!b) return ''; const c = b.cloneNode(true); c.querySelectorAll('small').forEach(x => x.remove()); return text(c); },
      goScene(i) { this.nav()[i]?.click(); },
      watch: () => [$('#sceneTitle')],
      live: () => $('#live'),
      heading: () => $('.scenehead'),
      card: () => $('aside.lesson'),
      figurePanel: () => $('section.board'),
      math: () => { try { return JSON.stringify(window.CourseApp.getState().math); } catch (_) { return null; } },
      blocks: {
