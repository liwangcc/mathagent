</style><style id="lesson-flow-style">/* MathAgent lesson flow v1 — presentation only (see lesson-flow.js). */
:root{--lf-motivate:#843f05;--lf-motivate-bg:#fff5e8;--lf-explore:#174f8f;--lf-explore-bg:#edf4fc;--lf-formalize:#0b5a53;--lf-formalize-bg:#e9f5f2;--lf-practice:#4f2398;--lf-practice-bg:#f3effb;--lf-ink:#10292a;--lf-soft:#33494a;--lf-line:#d3dfda}
body{--lf-c:var(--lf-motivate);--lf-bg:var(--lf-motivate-bg)}
body[data-lf-stage=explore]{--lf-c:var(--lf-explore);--lf-bg:var(--lf-explore-bg)}
body[data-lf-stage=formalize]{--lf-c:var(--lf-formalize);--lf-bg:var(--lf-formalize-bg)}
body[data-lf-stage=practice]{--lf-c:var(--lf-practice);--lf-bg:var(--lf-practice-bg)}
/* Projector type scale: 1280 px wide ≈ the minimums; grows to a 1920 px whiteboard.
   「大字」 (the chapter's own projector toggle) adds one more step. */
body.lf-on{--lf-t-read:clamp(19px,1.1vw + 5px,25px);--lf-t-key:clamp(21px,1.2vw + 6px,28px);--lf-t-eq:clamp(30px,1.7vw + 8px,40px);--lf-t-title:clamp(26px,1.4vw + 8px,34px);--lf-t-sub:clamp(17px,.8vw + 7px,21px);--lf-t-ui:clamp(15px,.6vw + 7px,18px)}
body.lf-on.projector,body.lf-on.large,body.lf-on.presentation{--lf-t-read:clamp(22px,1.3vw + 6px,29px);--lf-t-key:clamp(24px,1.4vw + 7px,32px);--lf-t-eq:clamp(34px,2vw + 9px,46px);--lf-t-sub:clamp(19px,.9vw + 8px,23px)}

/* Rail: four steps · prev/next · overview · help */
.lf-rail{position:relative;display:flex;align-items:center;gap:8px;flex-wrap:nowrap;justify-content:flex-end;margin-left:auto;flex:none}
.lf-steps{display:flex;gap:4px;list-style:none;margin:0;padding:3px;border:1px solid var(--lf-line);border-radius:999px;background:#fff}
.lf-steps li{margin:0}
.lf-step{display:flex;align-items:center;gap:6px;border:0!important;background:transparent!important;box-shadow:none!important;border-radius:999px!important;padding:5px 12px 5px 6px!important;min-height:36px;font-size:var(--lf-t-ui,16px);font-weight:650;color:var(--lf-soft)!important;white-space:nowrap}
.lf-step b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;font-size:13px;background:#e8eeeb;color:var(--lf-soft)}
.lf-step[data-lf-stage=motivate]{--c:var(--lf-motivate)}.lf-step[data-lf-stage=explore]{--c:var(--lf-explore)}.lf-step[data-lf-stage=formalize]{--c:var(--lf-formalize)}.lf-step[data-lf-stage=practice]{--c:var(--lf-practice)}
.lf-step:hover{background:#f1f5f3!important}
.lf-step.active{background:var(--c)!important;color:#fff!important}
.lf-step.active b{background:#fff;color:var(--c)}
.lf-move{display:flex;gap:6px}
.lf-move button,.lf-overview,.lf-help{min-height:40px;font-size:var(--lf-t-ui,15px);font-weight:650;border-radius:10px;padding:7px 13px;white-space:nowrap}
.lf-prev{width:6.9em}
.lf-next{background:var(--lf-c)!important;border-color:var(--lf-c)!important;color:#fff!important;width:14.4em;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.lf-next span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.lf-next:disabled{background:#e9eeeb!important;border-color:#d7e0db!important;color:#33494a!important;opacity:1}
.lf-help{width:40px;padding:0!important;font-weight:800}
.lf-help-panel{position:absolute;right:0;top:calc(100% + 8px);z-index:40;width:min(470px,92vw);background:#fff;color:var(--lf-ink);border:1px solid var(--lf-line);border-radius:14px;box-shadow:0 18px 44px #10292a33;padding:16px 18px;font-size:16px;line-height:1.6;text-align:left}
.lf-help-panel strong{display:block;font-size:17px;margin-bottom:6px;outline:none}
.lf-help-panel ul{margin:0;padding-left:20px}.lf-help-panel li{margin:4px 0}
.lf-help-panel kbd{font:600 13px ui-monospace,monospace;border:1px solid #c5d2cc;border-bottom-width:2px;border-radius:5px;padding:0 5px;background:#f6f8f7}

/* Stage card head (inside the existing side panel) */
.lf-card-head{display:none}
body.lf-on .lf-card-head{display:flex;gap:12px;align-items:center;padding:11px 16px;border-radius:14px;background:var(--lf-bg);border:1px solid #d9e2de;border:1px solid color-mix(in srgb,var(--lf-c) 28%,#fff);border-left:6px solid var(--lf-c)}
.lf-num{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--lf-c);color:#fff;font-size:19px;font-weight:800}
.lf-cue-line{margin:0!important;font-size:var(--lf-t-read)!important;line-height:1.45!important;color:var(--lf-ink)!important}
.lf-title{font-size:1.06em;color:var(--lf-c);margin-right:.55em;letter-spacing:.04em}
.lf-hint{display:none}
body.lf-on .lf-hint{display:block;font-size:14px;color:var(--lf-soft);margin-left:auto;margin-right:8px;text-align:right;line-height:1.3}

/* Controls inside the stage card never drop below 16 px on a projector. */
body.lf-on .lf-card button:not(.token){font-size:max(16px,var(--lf-t-ui));min-height:38px}
/* Data tables shown in a stage card are key content: reading size. */
body.lf-on .lf-card table th,body.lf-on .lf-card table td{font-size:var(--lf-t-read)}
/* Formula annotations (small/sub/sup labels) stay readable: 16 px, dark ink. */
body.lf-on .lf-card small{font-size:16px;font-weight:600;color:var(--lf-soft)}

/* Calm, legible transitions; reduced motion removes them entirely. */
@keyframes lf-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
body.lf-on .lf-card.lf-enter>*{animation:lf-in .24s ease-out both}
@media (prefers-reduced-motion:reduce){body.lf-on .lf-card.lf-enter>*{animation:none!important}}
body.low-motion .lf-card.lf-enter>*,body.reduced .lf-card.lf-enter>*,body.lf-reduce .lf-card.lf-enter>*{animation:none!important}

/* Folding: hidden blocks leave the layout, except keep-layout ones (parameter
   bars) which collapse to zero height and are inert, so in-figure editors that
   list "visible" source controls keep working in every stage. */
body.lf-on .lf-fold:not(.lf-keep){display:none!important}
body.lf-on .lf-keep.lf-fold{height:0!important;min-height:0!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;opacity:0;box-shadow:none!important}
body.lf-on .lf-tools{display:block}
body.lf-on:not(.lf-tools-open) .lf-tools{height:0;overflow:hidden;opacity:0}
.lf-tools-toggle{display:none}
body.lf-on .lf-tools-toggle{display:inline-flex;align-items:center;min-height:34px;font-size:14px;padding:4px 11px}

/* ---------- primary runtime (小学) ---------- */
/* Same hues as the chapter's A/B/C/R colour coding, darkened for projector contrast (≥6:1 on white). */
body.lf-on[data-lf-family=primary]{--muted:#3f5657;--a:#1f5f99;--b:#93530a;--c:#6a44a0;--teal:#0f6558}
/* Stacked fractions are key mathematics: full size in lesson mode (runtime default is .85em). */
body.lf-on[data-lf-family=primary] .frac{font-size:1em}
/* Tokens coloured inline with the runtime's teal (#147c69) get the same darker teal. */
body.lf-on[data-lf-family=primary] .token[style*="147c69"]{color:#0f6558!important}
body.lf-on[data-lf-family=primary] .topbar{padding:7px 18px}
body.lf-on[data-lf-family=primary] .brand-icon{width:32px;height:32px;font-size:19px}
body.lf-on[data-lf-family=primary] .eyebrow{display:none}
body.lf-on[data-lf-family=primary] .brand h1{font-size:21px}
body.lf-on[data-lf-family=primary] .scene-nav{padding:0 18px 7px}
body.lf-on[data-lf-family=primary] .scene-nav a{font-size:15px;padding:5px 11px}
body.lf-on[data-lf-family=primary] main{padding:7px 18px 20px}
body.lf-on[data-lf-family=primary] .scene-heading{align-items:center;margin:0 0 7px;gap:8px 14px}
body.lf-on[data-lf-family=primary] .scene-heading>div:first-child{flex:1;min-width:0}
body.lf-on[data-lf-family=primary] .scene-heading h2{font-size:var(--lf-t-title);line-height:1.25}
body.lf-on[data-lf-family=primary] .scene-heading p{font-size:var(--lf-t-sub);color:var(--lf-soft);margin-top:2px}
body.lf-on[data-lf-family=primary] #scene-code{display:none}
body.lf-on[data-lf-family=primary] .workbench{grid-template-columns:minmax(0,1.78fr) minmax(300px,1fr);gap:14px}
body.lf-on[data-lf-family=primary] .model-top{padding:3px 12px;min-height:36px}
body.lf-on[data-lf-family=primary] .model-top .right-label{display:none}
body.lf-on[data-lf-family=primary] .model-top strong{font-size:16px}
body.lf-on[data-lf-family=primary] .timeline{padding:4px 12px;gap:8px}
body.lf-on[data-lf-family=primary] .timeline-caption{font-size:15px;color:var(--lf-soft)}
/* --lf-fig-h is measured by lesson-flow.js: the height left under the figure's
   real top edge in the first screen, so the whole model is visible. */
body.lf-on[data-lf-family=primary] #diagram{width:min(100%,calc(var(--lf-fig-h,440px) * 1.7021));margin-inline:auto}
body.lf-on[data-lf-family=primary] #diagram text{font-size:23px}
body.lf-on[data-lf-family=primary] #diagram .small{font-size:19px;fill:#3f5657}
body.lf-on[data-lf-family=primary] #diagram .tiny{font-size:17px;fill:#3f5657}
body.lf-on[data-lf-family=primary] #diagram .label{font-size:23px}
body.lf-on[data-lf-family=primary] #diagram .big{font-size:30px}
/* The fallback warning is pinned directly under the figure title so the
   degradation is never below the fold (honest 2D path). */
body.lf-on[data-lf-family=primary] .model-panel{display:flex;flex-direction:column}
body.lf-on[data-lf-family=primary] .model-panel>*{order:2}
body.lf-on[data-lf-family=primary] .model-panel>.model-top{order:0}
body.lf-on[data-lf-family=primary] .model-panel>#fallback-warning{order:1;font-size:14px;line-height:1.4;padding:5px 12px;font-weight:650;border-bottom:1px solid #f0dcb4}
body.lf-on[data-lf-family=primary] .engine-badge{font-size:13px;font-weight:700;color:#23393a;background:#fffffff0;border:1px solid #cfdcd6;padding:3px 8px}
body.lf-on[data-lf-family=primary] .info-panel{gap:10px;align-self:stretch}
body.lf-on[data-lf-family=primary] .info-panel>.info-block{border-radius:14px;padding:13px 17px}
body.lf-on[data-lf-family=primary] .info-block h3{font-size:14px;color:var(--lf-soft)}
body.lf-on[data-lf-family=primary] .info-block p{font-size:var(--lf-t-key)}
body.lf-on[data-lf-family=primary] .info-block .plain,body.lf-on[data-lf-family=primary] .meaning-row{font-size:var(--lf-t-read);color:var(--lf-ink)}

 curve(fn,a=this.bounds[0],b=this.bounds[1],color=C.green,dash='',width=2.7){let d='',last=null;for(let i=0;i<=420;i++){const x=a+(b-a)*i/420,y=fn(x),p=this.to(x,y);if(!Number.isFinite(y)||p[1]<-this.h*4||p[1]>this.h*5){last=null;continue;}const move=!last||Math.abs(p[1]-last[1])>this.h*.9;d+=(move?'M':'L')+p[0].toFixed(2)+','+p[1].toFixed(2);last=p;}this.buf.push(`<path d="${d}" fill="none" stroke="${color}" stroke-width="${width}" ${dash?`stroke-dasharray="${dash}"`:''}/>`);}
 param(fn,a,b,color=C.green,close=false){let d='';for(let i=0;i<=300;i++){const p=this.to(...fn(a+(b-a)*i/300));d+=(i?'L':'M')+p.join(',');}this.buf.push(`<path d="${d}${close?'Z':''}" fill="none" stroke="${color}" stroke-width="2.5"/>`);}
 axes(xlabel='x',ylabel='y'){const ar=this.area||[0,0,this.w,this.h],X=ar[0],Y=ar[1],W=ar[2],H=ar[3];const bl=this.from(X+26,Y+H-26),tr=this.from(X+W-26,Y+26);const nice=(span,pixels)=>{let v=span/Math.max(2,pixels/75),e=10**Math.floor(Math.log10(v)),r=v/e;return (r<1.5?1:r<3?2:r<7?5:10)*e;};const dx=nice(tr[0]-bl[0],W),dy=nice(tr[1]-bl[1],H);for(let x=Math.ceil(bl[0]/dx)*dx;x<=tr[0]+dx*.01;x+=dx){this.line(x,bl[1],x,tr[1],C.line,1);if(Math.abs(x)>dx*.01){const p=this.to(x,0);this.textPx(p[0],M.clamp(p[1]+21,Y+22,Y+H-10),M.fmt(x,3),C.muted,'middle',14);}}for(let y=Math.ceil(bl[1]/dy)*dy;y<=tr[1]+dy*.01;y+=dy){this.line(bl[0],y,tr[0],y,C.line,1);if(Math.abs(y)>dy*.01){const p=this.to(0,y);this.textPx(M.clamp(p[0]-9,X+27,X+W-30),p[1]+5,M.fmt(y,3),C.muted,'end',14);}}this.line(bl[0],0,tr[0],0,C.muted,1.5,'',true);this.line(0,bl[1],0,tr[1],C.muted,1.5,'',true);const o=this.to(0,0);this.textPx(o[0]-8,o[1]+19,'O',C.muted,'end',14);this.textPx(X+W-12,M.clamp(o[1]-11,Y+20,Y+H-12),xlabel,C.muted,'end',15);this.textPx(M.clamp(o[0]+10,X+10,X+W-50),Y+19,ylabel,C.muted,'start',15);}

 dim(a,b,label,color=C.green,offset=[0,-13]){this.line(...a,...b,color,1.5,'',true);this.text((a[0]+b[0])/2,(a[1]+b[1])/2,label,color,'middle',offset);}
 bars(xs,values,color=C.green,width=.7){xs.forEach((x,i)=>{this.rect(x-width/2,0,width,values[i],color,color,.55);this.text(x,values[i],M.fmt(values[i],3),color,'middle',[0,values[i]>=0?-8:21]);});}
 cards(items,cols=6){const gap=8,margin=25,cell=(this.w-2*margin-gap*(cols-1))/cols;const rows=Math.ceil(items.length/cols),h=Math.min(53,(this.h-65-(rows-1)*gap)/Math.max(1,rows));items.forEach((item,i)=>{const x=margin+(i%cols)*(cell+gap)+(this.view.x||0),y=30+Math.floor(i/cols)*(h+gap)+(this.view.y||0);const z=this.view.zoom||1,X=this.w/2+(x-this.w/2)*z,Y=this.h/2+(y-this.h/2)*z;const key=item.run?'a'+(++this.seq):'';if(key)this.actions[key]=item.run;this.buf.push(`<g ${key?`data-action="${key}" class="item" tabindex="0" role="button" aria-label="${esc(item.label)}"`:''}><rect x="${X}" y="${Y}" width="${cell*z}" height="${h*z}" rx="7" fill="${item.fill||'#eef4ef'}" stroke="${item.stroke||C.line}"/><text x="${X+cell*z/2}" y="${Y+h*z/2+6}" text-anchor="middle" style="font-size:${Math.min(18,cell*.38)}px;stroke:none;fill:${item.color||C.green}">${esc(item.label)}</text></g>`);});}
 spaceStart(){this.space=true;return this;}
 project(v){const yaw=this.view.yaw??.72,pitch=this.view.pitch??.45,cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);const xr=v[0]*cy-v[1]*sy,yr=v[0]*sy+v[1]*cy;const scale=Math.min(this.w/12,this.h/10)*(this.view.zoom||1);return [this.w/2+xr*scale,this.h*.55+(sp*yr-cp*v[2])*scale,cp*yr+sp*v[2]];}
 line3(a,b,color=C.green,width=3,dash='',label=''){this.items3.push({depth:(this.project(a)[2]+this.project(b)[2])/2,kind:'line',a,b,color,width,dash});if(label)this.label3(M.mul(M.add(a,b),.5),label,color);}
 polygon3(points,color=C.green,opacity=.35){this.items3.push({depth:M.sum(points.map(p=>this.project(p)[2]))/points.length,kind:'poly',points,color,opacity});}
 label3(p,label,color=C.muted){const a=this.project(p);this.textPx(a[0]+8,a[1]-8,label,color);}
 dot3(p,label='',color=C.green){const a=this.project(p);this.items3.push({depth:a[2]+.01,kind:'dot',p,color});if(label)this.label3(p,label,color);}
 axisHandle3(p,key,value,axis,label,color=C.green){const q=this.project(p),d=this.project(M.add(p,axis)),dx=d[0]-q[0],dy=d[1]-q[1];return this.handlePx(q[0],q[1],key,(pt,drag)=>({[key]:value+(dx*dx+dy*dy<1e-6?drag.dx/40:(drag.dx*dx+drag.dy*dy)/(dx*dx+dy*dy))}),label,color);}
 axes3(len=4){this.line3([0,0,0],[len,0,0],C.orange,2,'','x');this.line3([0,0,0],[0,len,0],C.green,2,'','y');this.line3([0,0,0],[0,0,len],C.blue,2,'','z');this.dot3([0,0,0],'O');}
 box3(l,w,h,origin=[-l/2,-w/2,0],open=false,fold=90){const [x,y,z]=origin;const v=[[x,y,z],[x+l,y,z],[x+l,y+w,z],[x,y+w,z],[x,y,z+h],[x+l,y,z+h],[x+l,y+w,z+h],[x,y+w,z+h]];const ids=[[0,1,2,3],[0,1,5,4],[1,2,6,5],[2,3,7,6],[3,0,4,7]];if(!open)ids.push([4,5,6,7]);ids.forEach((f,i)=>this.polygon3(f.map(j=>v[j]),[C.green,C.blue,C.orange,C.blue,C.green,C.purple][i],.48));return v;}
 cylinder3(r,h,cone=false,origin=[0,0,0],closed=true){const o=origin,n=48;for(let i=0;i<n;i++){const a=2*Math.PI*i/n,b=2*Math.PI*(i+1)/n,P=[o[0]+r*Math.cos(a),o[1]+r*Math.sin(a),o[2]],Q=[o[0]+r*Math.cos(b),o[1]+r*Math.sin(b),o[2]],T=cone?[o[0],o[1],o[2]+h]:[Q[0],Q[1],Q[2]+h],S=cone?T:[P[0],P[1],P[2]+h];this.polygon3([P,Q,T,S],i<n/2?C.blue:C.green,.54);}if(closed||!cone)this.polygon3(Array.from({length:n},(_,i)=>[o[0]+r*Math.cos(i*2*Math.PI/n),o[1]+r*Math.sin(i*2*Math.PI/n),o[2]]),C.blue,.5);if(!cone&&closed)this.polygon3(Array.from({length:n},(_,i)=>[o[0]+r*Math.cos(i*2*Math.PI/n),o[1]+r*Math.sin(i*2*Math.PI/n),o[2]+h]),C.green,.5);}
 sphere3(r){for(let j=0;j<14;j++)for(let i=0;i<28;i++){const a=-Math.PI/2+j*Math.PI/14,b=a+Math.PI/14,t=i*2*Math.PI/28,u=t+2*Math.PI/28;const f=(q,p)=>[r*Math.cos(q)*Math.cos(p),r*Math.cos(q)*Math.sin(p),r*Math.sin(q)];this.polygon3([f(a,t),f(a,u),f(b,u),f(b,t)],j<7?C.blue:C.green,.58);}}
 finish(){if(this.space){const overlay=this.buf.splice(1);this.items3.sort((a,b)=>a.depth-b.depth).forEach(o=>{if(o.kind==='poly'){const p=o.points.map(v=>this.project(v));this.buf.push(`<polygon points="${p.map(v=>v.slice(0,2).join(',')).join(' ')}" fill="${o.color}" fill-opacity="${o.opacity}" stroke="${o.color}" stroke-opacity=".65" stroke-width="1.1"/>`);}else if(o.kind==='line'){const a=this.project(o.a),b=this.project(o.b);this.linePx(a[0],a[1],b[0],b[1],o.color,o.width,o.dash);}else{const p=this.project(o.p);this.buf.push(`<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="${o.color}" stroke="white" stroke-width="2"/>`);}});this.buf.push(...overlay);}
 // Label placement: keep labels inside, avoid overlap where a nearby offset suffices.
 this.buf.push(...this.controls);const used=[];for(const l of this.labels){const chars=[...l.label].reduce((n,c)=>n+(c.charCodeAt(0)>255?1:.58),0),w=Math.min(this.w-16,chars*l.size),h=l.size+3;let x=l.x,y=l.y,anchor=l.anchor;let left=anchor==='middle'?x-w/2:anchor==='end'?x-w:x;left=M.clamp(left,7,this.w-w-7);y=M.clamp(y,h+3,this.h-8);let yy=y;for(let k=0;k<4;k++){if(!used.some(r=>left<r.x+r.w&&left+w>r.x&&yy-h<r.y+3&&yy>r.y-h))break;yy=M.clamp(y+(k%2?-1:1)*(Math.floor(k/2)+1)*(h+4),h+3,this.h-8);}used.push({x:left,y:yy,w,h});this.buf.push(`<text x="${left}" y="${yy}" text-anchor="start" style="font-size:${l.size}px;fill:${l.color}">${esc(l.label)}</text>`);}
 this.buf.push('</g>');this.svg.innerHTML=this.buf.join('');this.svg.dataset.dimension=this.space&&!this.planar?'3':'2';this.svg.dataset.offscreenAnchors=this.offscreenLabels;return this;}
}
</script><script>const CHAPTER={"id": "H08", "title": "复数", "definition": "复数a+bi中的a、b为实数，i²=−1；在复平面对应点(a,b)。乘以i是逆时针旋转90°，不是把点向上平移1。", "conditions": "(a+bi)(c+di)=(ac−bd)+(ad+bc)i；|z|=√(a²+b²)；除法用共轭，除数≠0；三角形式z=r(cosθ+i sinθ)，z≠0时辐角模2π。", "state": "z1,z2、operation、origins、polarView；实虚部分开精确或容差；三角形式按原目录作为可选视角。", "labels": "实轴/虚轴，1与i单位点；z点、模r、辐角θ；乘数的模与角解释对应缩放/旋转。", "anchors": "i²=−1；(1+i)²=2i；1/i=−i；除0禁止；z0的辐角未定义。", "scenes": [{"id": "H08-S01", "title": "复数与几何", "coverage": ["复数的概念", "复数的几何意义"], "design": "a和b滑块分别改变实/虚坐标；实数位于实轴，i与−1关系通过连续乘i的四点轨迹。"}, {"id": "H08-S02", "title": "加减乘除", "coverage": ["复数的四则运算"], "design": "加法箭头头尾连接，乘i旋转保持模；一般乘法先缩放再转角，除法展示逆操作与共轭。"}, {"id": "H08-S03", "title": "三角形式", "coverage": ["复数的三角形式"], "design": "切坐标形式与r、θ；r0时角不唯一，明确不定义辐角；教师可隐藏该拓展，不强制先学极坐标。"}], "knowledge": [{"id": "H08-K01", "name": "复数的概念", "scene": "H08-S01"}, {"id": "H08-K02", "name": "复数的几何意义", "scene": "H08-S01"}, {"id": "H08-K03", "name": "复数的四则运算", "scene": "H08-S02"}, {"id": "H08-K04", "name": "复数的三角形式", "scene": "H08-S03"}]};const SCENES={};const register=(id,s)=>{SCENES[id]=s;};
const P=(key,label,min,max,step,value,unit='')=>({key,label,min,max,step,value,unit});const Q=(key,label,options,value)=>({key,label,options,value});
const F=(x,d=4)=>M.fmt(x,d), T=(key,text)=>`<button class="token" data-select="${key}">${text}</button>`;const metrics=(...a)=>a;const metric=(label,value,unit='')=>({label,value,unit});const list=a=>a.map(x=>F(x)).join('，');const table=(heads,rows)=>`<table class="table"><thead><tr>${heads.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
(()=>{
function zdraw(g,p,a,b,color,label){g.line(0,0,p[a],p[b],color,3,'',true);g.handle(p[a],p[b],a,([x,y])=>({[a]:x,[b]:y}),label,color);}
const ztext=(a,b)=>`${F(a)}${b<0?'−':'+'}${F(Math.abs(b))}i`;
register('H08-S01',{params:[P('a','实部 a',-5,5,.1,1),P('b','虚部系数 b',-5,5,.1,1),P('n','连续乘 i 的次数',0,4,1,0)],definition:'复数 a+bi 的 a、b 都是实数，i²=−1；它在复平面对应点 (a,b)。乘以 i 把向量逆时针旋转 90°，不是向上平移 1。',boundary:{a:0,b:0,n:1},boundaryNote:'复数 0 的模为 0，但辐角没有定义。i 的四次幂为 1，连续乘四次回到原数。',actions:[{label:'再乘一次 i',run:p=>({n:p.n+1})},{label:'少乘一次 i',run:p=>({n:p.n-1})}],animate:{key:'n',from:0,to:4,label:'每步逆时针转 90°，模保持不变；步数只取整数。'},render(p,g){g.range(-6,6,-6,6,true);g.axes('实轴 Re','虚轴 Im');zdraw(g,p,'a','b',C.green,'z='+ztext(p.a,p.b));const r=Math.hypot(p.a,p.b);g.circle(0,0,r,C.muted);let z=[p.a,p.b];for(let i=1;i<=p.n;i++){const next=[-z[1],z[0]];g.line(...z,...next,C.blue,1,'4 4');g.dot(...next,'i^'+i+'z',C.blue);z=next;}return {formula:`z=${ztext(p.a,p.b)}<br>iz=${ztext(-p.b,p.a)}<br>i²=−1，i⁴=1`,fact:`乘 ${p.n} 次 i 后为 ${ztext(...z)}，模始终为 ${F(r)}。${p.b===0?'当前 z 位于实轴。':p.a===0?'当前 z 是纯虚数。':'当前 z 实部、虚部系数均非零。'}`,correspondence:'横坐标是实部 a，纵坐标是虚部系数 b。参考圆表示模不变，蓝色点表示每次乘 i 后的位置。',why:'i(a+bi)=−b+ai，因此坐标由 (a,b) 变为 (−b,a)，正是逆时针 90° 旋转。模平方 a²+b² 保持。',metrics:[metric('实部',F(p.a)),metric('虚部系数',F(p.b)),metric('模 |z|',F(r))],answer:`最终复数 ${ztext(...z)}，模 ${F(r)}。乘 i 是旋转，不是加 i 的平移。`};}});
register('H08-S02',{params:[P('a','z₁ 实部',-4,4,.1,1),P('b','z₁ 虚部系数',-4,4,.1,1),P('c','z₂ 实部',-4,4,.1,1),P('d','z₂ 虚部系数',-4,4,.1,1),Q('op','运算',['+','−','×','÷'],'×')],definition:'复数加减分别计算实部和虚部系数；乘法展开后用 i²=−1 合并。除法须除数非零，并乘以除数的共轭，不能把实部、虚部分别相除。',boundary:{op:'÷',c:0,d:0},boundaryNote:'除数 0 使模平方分母为 0，复数除法未定义。',actions:[{label:'(1+i)²=2i',run:()=>({a:1,b:1,c:1,d:1,op:'×'})},{label:'1/i=−i',run:()=>({a:1,b:0,c:0,d:1,op:'÷'})}],animate:{key:'c',from:-3,to:3,label:'改变 z₂ 的实部，结果从同一复数公式即时重算。'},render(p,g){let x,y;const den=p.c*p.c+p.d*p.d;if(p.op==='+'){x=p.a+p.c;y=p.b+p.d;}if(p.op==='−'){x=p.a-p.c;y=p.b-p.d;}if(p.op==='×'){x=p.a*p.c-p.b*p.d;y=p.a*p.d+p.b*p.c;}if(p.op==='÷'){x=den?(p.a*p.c+p.b*p.d)/den:null;y=den?(p.b*p.c-p.a*p.d)/den:null;}g.range(-10,10,-10,10,true);g.axes('Re','Im');zdraw(g,p,'a','b',C.green,'z₁');zdraw(g,p,'c','d',C.blue,'z₂');if(x!==null){g.line(0,0,x,y,C.orange,4,'',true);g.dot(x,y,'结果 '+ztext(x,y),C.orange);if(p.op==='+')g.line(p.a,p.b,x,y,C.blue,3,'',true);}return {formula:`z₁=${ztext(p.a,p.b)}<br>z₂=${ztext(p.c,p.d)}<br>z₁ ${p.op} z₂=${x===null?'未定义':ztext(x,y)}`,fact:x===null?'除数为 0，不输出结果点。':`结果为 ${ztext(x,y)}，模 ${F(Math.hypot(x,y))}。${p.op==='×'?'模相乘、辐角相加（非零时）。':''}`,correspondence:'绿色和蓝色是两个可输入的复数，橙色结果由运算派生，不能独立拖动。加法时蓝色的平移副本首尾接在 z₁ 后。',why:p.op==='×'?'(a+bi)(c+di)=(ac−bd)+(ad+bc)i。非零时也可用旋转与伸缩解释。':p.op==='÷'?'分子分母同时乘 c−di，分母变为 c²+d²，实部为 (ac+bd)/(c²+d²)，虚部系数为 (bc−ad)/(c²+d²)。':'加减按对应分量运算，几何上对应自由向量的加减。',metrics:[metric('结果实部',F(x)),metric('结果虚部系数',F(y)),metric('除数模平方',F(den))],answer:x===null?'z₂=0，除法没有定义。':`结果 ${ztext(x,y)}，由实部、虚部展开核对，不是分别相除。`};}});
register('H08-S03',{params:[P('r','模 r',0,5,.1,2),P('theta','表示角 θ',-360,360,1,60,'°')],definition:'非零复数可写成 z=r(cosθ+i sinθ)，其中 r=|z|>0。辐角相差 2kπ 表示同一个复数；z=0 时没有确定的辐角。',boundary:{r:0},boundaryNote:'r=0 时任意表示角都会给出同一个 0，但不能说 0 的辐角等于当前滑块角度。',animate:{key:'theta',from:-360,to:360,label:'固定模，在圆上旋转；相差整圈的角回到同一个复数。'},render(p,g){g.range(-6,6,-6,6,true);g.axes('Re','Im');const x=p.r*M.cos(p.theta),y=p.r*M.sin(p.theta);g.circle(0,0,p.r,C.blue);g.line(0,0,x,y,C.green,3,'',true);g.handle(x,y,'r',([x,y])=>({r:Math.hypot(x,y),theta:M.deg(Math.atan2(y,x))}),'z：模与表示角',C.green);g.line(x,0,x,y,C.orange,1,'4 4');return {formula:`z=${F(p.r)}(cos${p.theta}°+i sin${p.theta}°)<br>z=${ztext(x,y)}`,fact:p.r===0?'当前 z=0，辐角未定义。表示角滑块只是保留的构造参数，不作为 0 的辐角。':`模 ${F(p.r)}，辐角可写为 ${p.theta}°+360°k（k∈ℤ）。`,correspondence:'半径对应模 r，终边方向对应一个表示角，投影给 a=r cosθ、b=r sinθ。该三角形式视角可直接跳过，不作为其他场景的入口门槛。',why:'由直角坐标与极坐标关系可得复数三角形式。非零时模唯一，辐角只在模 2π 意义下确定。',metrics:[metric('a=r cosθ',F(x)),metric('b=r sinθ',F(y)),metric('辐角',p.r===0?'未定义':p.theta+'°+360°k')],answer:`坐标形式 ${ztext(x,y)}。${p.r===0?'模为 0，辐角未定义。':`模为 ${F(p.r)}，所有辐角相差整数倍 360°。`}`};}});
})();

(()=>{
const rules={
'H03-S01':{branch:p=>p.family!=='piece'},
'H03-S05':{base:p=>p.mode!=='fare',rate:p=>p.mode!=='fare',initial:p=>p.mode!=='temperature'},

   answer shown in a stage is the node the chapter already rendered; the only
