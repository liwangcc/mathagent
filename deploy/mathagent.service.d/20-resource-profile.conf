[Service]
# Versioned copy of the production drop-in, installed by deploy/setup.sh to
# /etc/systemd/system/mathagent.service.d/20-resource-profile.conf.
# Network windows match the shared model budget. CPU and image-byte admission
# stay independent; low_memory must not restore retired network limits.
# 2026-09-11 measured (real-payload concurrency probe /root/qwen-cap-probe-20260911):
#   qwen3.8-flash clean at >=320 -> shared Flash lane 256 (80%);
#   the retired qwen3.7-plus lane is not used for sizing this route.
# One worker: these process-local windows are lane caps; Redis keeps the
# shared 256-slot qwen3.8-flash backboard plus per-teacher fairness.
# 识图 and roster photos use the same Flash route and image-byte budget;
# DeepSeek and MiMo grading are retired.
Environment="MATHAGENT_RESOURCE_PROFILE=low_memory"
Environment="OCR_LOCAL_MAX_CONCURRENT=256"
Environment="OCR_BATCH_DISPATCH_CONCURRENT=256"
Environment="OCR_IMAGE_PAYLOAD_MEMORY_BUDGET_BYTES=268435456"
Environment="OCR_PREPROCESS_LOCAL_MAX_CONCURRENT=8"
Environment="FLASH_LOCAL_MAX_CONCURRENT=256"
Environment="OCR_PER_TEACHER_LIMIT=256"
Environment="MODEL_TEACHER_BASE_CONCURRENCY=30"
Environment="MODEL_TEACHER_BURST_CONCURRENCY=256"
Environment="MODEL_GLOBAL_RESERVE_CONCURRENCY=0"
