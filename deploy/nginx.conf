# MathAgent Nginx template
# Replace __DOMAIN__ with your domain, for example:
#   sudo sed -i 's/__DOMAIN__/math.example.com/g' /etc/nginx/sites-available/mathagent
# TLS certificates are expected at:
#   /etc/letsencrypt/live/__DOMAIN__/fullchain.pem
#   /etc/letsencrypt/live/__DOMAIN__/privkey.pem

server {
    listen 80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    # SEC-02: do not use automatically managed TLS session-ticket keys.
    ssl_session_tickets off;

    # The application accepts at most 2 GiB of file bytes. Leave room for the
    # multipart envelope while keeping the proxy and application limits aligned.
    client_max_body_size 2100M;
    client_body_timeout 600s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1000;

    location /health {
        proxy_pass http://127.0.0.1:8080;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    location / {
        root /opt/mathagent/frontend/dist;
        try_files $uri $uri/ /index.html;

        # 静态页面由 nginx 直接返回，FastAPI 中间件加的安全头不经过这里。
        # 缺了这些头，主界面可被 iframe 套用（点击劫持）、MIME 嗅探生效，
        # 且登录 token 会随 Referer 泄露给外链。
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://*.alicaptcha.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://*.alicaptcha.com; frame-src https://*.alicaptcha.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    # 手机拍摄页需要摄像头；其余页面一律禁用（与后端 _permissions_policy 一致）。
    # /capture/<id> is an SPA route with no file on disk. A URI as the LAST try_files
    # argument is an internal redirect: /index.html would be re-matched by `location /`
    # above and served with camera=(), so getUserMedia is denied. Checking /index.html
    # as a file (with =404 last) serves it from this location, with camera=(self).
    location ^~ /capture/ {
        root /opt/mathagent/frontend/dist;
        try_files $uri /index.html =404;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://*.alicaptcha.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://*.alicaptcha.com; frame-src https://*.alicaptcha.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # OCR and grading endpoints stream SSE progress.  Explicitly disable
        # proxy buffering/compression so heartbeats reach the browser and keep
        # the upstream connection alive through long model calls.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;
        # Keep the proxy window above the frontend's 660s bounded grading
        # operation timeout. SSE heartbeats refresh this idle timeout during
        # longer OCR batches.
        proxy_read_timeout 720s;
        proxy_send_timeout 720s;
    }

    # 家长信公开落地页（/letter/<token>）由后端处理，必须代理而非落到 SPA 静态根。
    location /letter/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 试卷照片含未成年人 PII：绝不能用静态 alias 直出（会绕过 FastAPI 鉴权 + 归属校验，
    # 任何人猜到文件名即可匿名下载，P0-1）。统一反代到后端的鉴权端点 serve_upload。
    location /uploads/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
